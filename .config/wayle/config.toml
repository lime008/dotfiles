[general]
font-sans = "Noto Sans"
font-mono = "FiraCode Nerd Font Mono"

[bar]
inset-edge = 0.5
inset-ends = 0.6000000238418579
padding = 0.5
module-gap = 1.5
rounding = "sm"
shadow = "floating"
button-variant = "basic"
button-bg-opacity = 0
button-icon-size = 0.949999988079071
button-icon-padding = 0.25
button-label-padding = 0.25
button-rounding = "full"
button-gap = 2.0

[[bar.layout]]
monitor = "eDP-1"
show = true
left = [
    "hyprland-workspaces",
    "window-title",
]
center = [
    "clock",
    "world-clock",
]
right = [
    "media",
    "battery",
    "bluetooth",
    "network",
    "microphone",
    "volume",
    "systray",
    "hyprsunset",
    "notifications",
    "dashboard",
]

[[bar.layout]]
monitor = "DP-1"
show = true
left = [
    "hyprland-workspaces",
    "window-title",
]
center = [
    "clock",
    "world-clock",
]
right = [
    "media",
    "battery",
    "bluetooth",
    "network",
    "microphone",
    "volume",
    "systray",
    "hyprsunset",
    "notifications",
    "dashboard",
]

[[bar.layout]]
monitor = "*"
show = true
left = [
    "hyprland-workspaces",
    "window-title",
]
center = ["clock"]
right = [
    "systray",
    "notifications",
    "dashboard",
]

[styling]
scale = 1.0

[styling.palette]
bg = "#594671"
surface = "#292640"
fg = "#f3ffb5"
fg-muted = "#b4befe"
primary = "#f5c2e6"

[modules.clock]
format = "%a %d. %b %H:%M:%S"
dropdown-show-seconds = true

[modules.dashboard]
icon-override = "archlinux"
icon-color = "#d9ed00"

[modules.hyprland-workspaces]
min-workspace-count = 9
monitor-specific = false
icon-gap = 0.0
workspace-padding = 0.44999998807907104
occupied-color = "accent"

[modules.systray]
item-gap = 0.5

[modules.window-title]
icon-color = "border-accent"
icon-bg-color = "auto"
label-color = "accent"
label-max-length = 20

[modules.world-clock]
format = "{{ tz('Asia/Dubai', 'Dubai %H:%M') }}    {{ tz('Europe/Paris', 'Paris %H:%M') }}    {{ tz('America/New_York', 'New York %H:%M') }}"

[osd]
position = "bottom-right"
margin = 10.0
